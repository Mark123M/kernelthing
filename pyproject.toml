[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelthing"
version = "0.1.0"
description = "Autonomous evolutionary GPU-kernel optimization loop driving the opencode agent."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{ name = "Aaron Pazdera", email = "aarpazdera@gmail.com" }]
requires-python = ">=3.11"

# The ``opencode`` CLI (and Node, for the guard plugin) are external prerequisites,
# not pip deps.
dependencies = [
  "kernelguard",
  "PyYAML>=6.0",
]
# Scoring is remote: kernels are graded on the hosted gpu-mode popcorn service
# (see kernelthing/popcorn.py), so there is no local benchmark engine and no
# torch/CUDA dependency. ``kernelthing score`` submits to popcorn and parses the
# result; the loop never touches a local GPU.
[project.urls]
GitHub = "https://github.com/apaz-cli/kernelthing"

[project.optional-dependencies]
# Test / development tooling.
dev = ["pytest", "ruff>=0.11.0", "mypy>=1.14"]

[project.scripts]
kernelthing = "kernelthing.cli:main"

[tool.setuptools.packages.find]
include = ["kernelthing*"]

# The opencode PreToolUse guard plugin ships inside the package (loaded by
# opencode as an external plugin; see kernelthing/opencode_client.py).
[tool.setuptools.package-data]
kernelthing = [
  "oc_guard/*.js", "oc_guard/*.json", "webui/*.html", "webui/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Trees that follow someone else's conventions, not ours, so that `ruff check .` stays a
# meaningful gate on kernelthing's own code. Problem dirs hold competition submissions
# (kernel code uses matrix-style names the N rules reject, and reformatting them would
# diverge them from the source they were vendored from); popcorn-cli is a third-party
# checkout kept for reference. mypy already excludes problems/ for the same reason.
extend-exclude = ["problems/", "popcorn-cli/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "T20", "Q", "RUF", "SIM", "C4"]
# T201: print() to stderr is the intended logger for this CLI tool
# E501: line length is enforced by the formatter; the webui inline HTML/JS is exempt
ignore = ["T201", "E501"]

[tool.ruff.lint.per-file-ignores]
"kernelthing/webui/__init__.py" = ["SIM102"]
[tool.ruff.lint.isort]
known-first-party = ["kernelthing"]

[tool.mypy]
strict = true
exclude = ["tests/", "build/", ".venv/", "sandbox/", "vendor/", "problems/"]
ignore_missing_imports = true
disallow_untyped_defs = true
